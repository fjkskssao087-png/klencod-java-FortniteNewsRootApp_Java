<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fortnite News Pro</title>
    <style>
        :root {
            --bg: #0b0e17;
            --card: #151b2b;
            --accent: #3b82f6;
            --gold: #f59e0b;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; overflow-x: hidden; }
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(11, 14, 23, 0.9); backdrop-filter: blur(10px);
            padding: 16px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        .logo { font-size: 20px; font-weight: 900; background: linear-gradient(90deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: #1e293b; color: #38bdf8; font-weight: bold; }
        .tabs { display: flex; gap: 10px; padding: 12px 16px; overflow-x: auto; }
        .tab { background: var(--card); border: 1px solid #1e293b; color: var(--muted); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; white-space: nowrap; transition: 0.2s; }
        .tab.active { background: var(--accent); color: white; border-color: var(--accent); transform: scale(1.03); }
        .container { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: transform 0.15s; }
        .card:active { transform: scale(0.98); }
        .card img { width: 100%; height: 190px; object-fit: cover; display: block; background: #1e293b; }
        .card-body { padding: 14px; }
        .tag { display: inline-block; background: rgba(59, 130, 246, 0.2); color: #60a5fa; font-size: 11px; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px; font-weight: bold; }
        .card h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.4; }
        .card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
        .btn-root {
            margin: 16px; width: calc(100% - 32px); padding: 14px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; font-weight: bold; font-size: 14px;
        }
        .loader { text-align: center; padding: 40px; color: var(--muted); }
    </style>
</head>
<body>

<header>
    <div class="logo">FORTNITE NEWS PRO</div>
    <div class="badge" id="rootBadge">جاري الفحص...</div>
</header>

<div class="tabs">
    <div class="tab active" onclick="loadNews('br', this)">باتل رويال</div>
    <div class="tab" onclick="loadNews('stw', this)">طور الزومبي</div>
    <div class="tab" onclick="loadNews('creative', this)">الإبداعي</div>
</div>

<div class="container" id="newsContainer">
    <div class="loader">جاري جلب أحدث أخبار فورت نايت عبر الإنترنت...</div>
</div>

<button class="btn-root" onclick="recheckRoot()">إعادة طلب صلاحية الروت (Magisk)</button>

<script>
    function updateRootBadge(isRooted) {
        const badge = document.getElementById('rootBadge');
        if (isRooted) {
            badge.innerText = "ROOT: مفعّل";
            badge.style.background = "rgba(34, 197, 94, 0.2)";
            badge.style.color = "#4ade80";
        } else {
            badge.innerText = "ROOT: غير مفعّل";
            badge.style.background = "rgba(239, 68, 68, 0.2)";
            badge.style.color = "#f87171";
        }
    }

    function recheckRoot() {
        if (window.AndroidBridge) {
            window.AndroidBridge.requestRootAgain();
        } else {
            alert("يعمل هذا الزر داخل تطبيق الأندرويد فقط.");
        }
    }

    async function loadNews(mode, el) {
        if (el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }
        const container = document.getElementById('newsContainer');
        container.innerHTML = '<div class="loader">جاري تحديث الأخبار...</div>';

        try {
            // جلب الأخبار الحية من Fortnite-API
            const response = await fetch('https://fortnite-api.com/v2/news?language=ar');
            const json = await response.json();
            
            let items = [];
            if (json.status === 200 && json.data) {
                if (mode === 'br' && json.data.br) items = json.data.br.motds || [];
                else if (mode === 'stw' && json.data.stw) items = json.data.stw.messages || [];
                else if (mode === 'creative' && json.data.creative) items = json.data.creative.motds || [];
            }

            if (!items || items.length === 0) {
                throw new Error("لا توجد أخبار متاحة حالياً لهذا القسم");
            }

            container.innerHTML = items.map(item => `
                <div class="card">
                    <img src="${item.image || item.tileImage || ''}" alt="Fortnite News" loading="lazy">
                    <div class="card-body">
                        <span class="tag">${item.tabTitle || 'تحديث جديد'}</span>
                        <h3>${item.title || 'خبر فورت نايت'}</h3>
                        <p>${item.body || ''}</p>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            container.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <span class="tag">تنبيه الاتصال</span>
                        <h3>تعذر جلب الأخبار الحية</h3>
                        <p>تأكد من اتصالك بالإنترنت أو اسحب الشاشة للأسفل للتحديث. (${err.message})</p>
                    </div>
                </div>`;
        }
    }

    // تحميل الأخبار تلقائياً عند فتح التطبيق
    loadNews('br');
</script>
</body>
</html>
